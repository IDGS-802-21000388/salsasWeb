<h2 mat-dialog-title class="text-center mb-4">{{ salsaKey }}</h2>

<mat-dialog-content>
   <!-- Radio buttons para seleccionar tamaño -->
   <h3 class="font-weight-bold mb-3 mt-4">Selecciona un tamaño:</h3>
   <div *ngFor="let producto of productos" class="form-check mb-3">
     <input
       class="form-check-input"
       type="radio"
       id="producto-{{ producto.idProducto }}"
       [value]="producto"
       name="selectedProduct"
       (change)="onSizeSelected(producto)"
       [checked]="producto === selectedProducto">
     <label class="form-check-label" for="producto-{{ producto.idProducto }}">
       {{ producto.cantidad }} {{ getUnit(producto.cantidad) }} - {{ producto.precioVenta | currency }}
     </label>
   </div>

  <div class="d-flex flex-column">
    <!-- Selección de tipo de producto: Individual o Caja -->
    <h3 class="font-weight-bold mb-3">Selecciona el tipo de producto:</h3>
    <div class="d-flex justify-content-between mb-4">
      <button class="btn btn-outline-primary btn-sm w-auto" 
              (click)="onTipoProductoSeleccionado('individual')" 
              [ngClass]="{'active': !esCaja}">
        Individual
      </button>
      <button class="btn btn-outline-primary btn-sm w-auto" 
              (click)="onTipoProductoSeleccionado('caja')" 
              [ngClass]="{'active': esCaja}">
        Caja
      </button>
    </div>
  </div>
</mat-dialog-content>

<!-- Si se selecciona "Caja", mostrar opciones de cantidad de cajas -->
<div *ngIf="esCaja">
  <div class="d-flex flex-column mb-3 m-4">
    <button *ngFor="let tamano of [6, 12, 24]" 
            class="btn btn-outline-success btn-sm w-auto mb-2" 
            (click)="setCaja(tamano)" 
            [ngClass]="{'active': tipoCajaSeleccionada === tamano}">
      Caja de {{ tamano }} Salsas
    </button>

    <!-- Campo para ingresar la cantidad de cajas -->
    <input *ngIf="tipoCajaSeleccionada !== null" 
           type="number" 
           [(ngModel)]="cantidadCajas" 
           min="1" 
           class="form-control w-auto" 
           placeholder="Cantidad de cajas" />
  </div>
</div>

<!-- Si se selecciona "Individual", mostrar campo de cantidad para salsas -->
<div *ngIf="!esCaja" class="mt-3 m-4">
  <label for="cantidadSeleccionada" class="form-label">Cantidad:</label>
  <input 
    type="number" 
    [(ngModel)]="cantidadSeleccionada" 
    min="1" 
    class="form-control w-auto" 
    id="cantidadSeleccionada" 
    inputmode="numeric" 
    (keypress)="validateInput($event)" />
</div>

<mat-dialog-actions class="d-flex justify-content-end">
  <button mat-button class="btn btn-secondary me-2" (click)="onNoClick()">Cancelar</button>
  <button mat-raised-button class="btn btn-primary" [disabled]="!selectedProducto" (click)="addToCart()">
    Agregar al carrito
  </button>
</mat-dialog-actions>
